<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração · Área do aluno · Trader Positivo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
.adm { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px }
.adm-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px }
.numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px }
@media (max-width: 700px) { .numeros { grid-template-columns: 1fr 1fr } }
.numero b { display: block; font-family: var(--mono); font-size: 26px }
.numero span { font-size: 12px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em }
.ferr { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 }
.ferr .campo { flex: 1; min-width: 200px }
.linhas { display: grid; gap: 8px }
.linha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 16px }
.linha .quem { flex: 1; min-width: 200px }
.linha .quem b { display: block; overflow-wrap: anywhere }
.linha .quem span { font-size: 13px; color: var(--fg2); overflow-wrap: anywhere }
.linha .acoes { display: flex; gap: 6px; flex-wrap: wrap }
dialog { margin: auto; background: var(--bg2); color: var(--fg); border: 1px solid var(--linha2); border-radius: 18px; padding: 22px; width: min(540px, calc(100vw - 24px)); max-height: 92vh }
dialog::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(4px) }
dialog h3 { font-size: 20px; margin-bottom: 14px }
.marcas { display: flex; flex-wrap: wrap; gap: 14px }
.marcas label, .marca-unica { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--fg); margin: 0 }
.dica { font-size: 12px; color: var(--fg3); margin-top: 4px }
.rodape-dlg { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap }
</style>
</head>
<body>
<div class="adm" id="adm" hidden>
  <div class="adm-topo">
    <div><div class="olho">Trader Positivo · Área do aluno</div><h2 style="font-size:28px;margin-top:4px">Administração</h2></div>
    <a class="btn contorno peq" href="index.html">← Voltar à Área do aluno</a>
  </div>
  <div class="faixa demo" id="avisoDemo" hidden><span>Modo demonstração: o que você mudar aqui fica só neste navegador.</span></div>
  <div class="chips" id="abas"></div>
  <div id="corpo" style="margin-top:16px"></div>
</div>
<p class="adm sub" id="semAcesso" hidden>Esta área é só para administradores. <a href="index.html">Voltar</a></p>

<dialog id="dlg"><form id="form" novalidate><h3 id="dlgTitulo"></h3><div id="campos"></div><p class="msg erro" id="dlgMsg"></p>
  <div class="rodape-dlg"><button class="btn contorno" type="button" id="dlgRemover" style="margin-right:auto;color:var(--red)" hidden>Remover</button>
  <button class="btn contorno" type="button" id="dlgCancelar">Cancelar</button><button class="btn ouro" type="submit">Salvar</button></div></form></dialog>

<script type="module">
import { repo, DEMO, PLANOS, hojeSP, maisDias, emDia, CHAVES } from './repo.js'

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const dataBR = (iso) => (iso ? iso.slice(0, 10).split('-').reverse().join('/') : '—')
const TZ = 'America/Sao_Paulo'
const quando = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: TZ })
// datetime-local (horário de Brasília) <-> ISO
const paraLocal = (iso) => (iso ? new Date(new Date(iso).getTime() - 3 * 3600e3).toISOString().slice(0, 16) : '')
const deLocal = (v) => (v ? new Date(v + ':00-03:00').toISOString() : null)
const TODOS = Object.keys(PLANOS)

const sessao = await repo.sessao()
if (!sessao || !(await repo.souAdmin())) { $('semAcesso').hidden = false; throw new Error('sem acesso') }
$('adm').hidden = false
$('avisoDemo').hidden = !DEMO

let cursos = []
// ── configuração de cada aba: lista + formulário ────────────────────────────
const ABAS = {
  assinaturas: {
    nome: 'Alunos', novo: '+ Novo aluno', ordem: (a, b) => (a.acesso_ate || '').localeCompare(b.acesso_ate || ''),
    busca: (x) => `${x.email} ${x.nome}`,
    linha: (x) => `<div class="quem"><b>${esc(x.nome || x.email)}</b><span>${esc(x.email)} · ${esc(PLANOS[x.plano] || x.plano)}${x.tradersystem ? ' · <span class="tag plus">PLUS</span>' : ''}${x.observacao ? ' · ' + esc(x.observacao) : ''}</span></div>
      <span class="tag ${emDia(x) ? 'compra' : 'venda'}">${emDia(x) ? 'até ' : 'venceu '}${dataBR(x.acesso_ate)}</span>
      <div class="acoes"><button class="btn leve peq" type="button" data-renovar="${esc(x.email)}">+30 dias</button><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'email', t: 'E-mail (o mesmo da compra)', tipo: 'email', obrig: true, fixoAoEditar: true },
      { k: 'nome', t: 'Nome' },
      { k: 'plano', t: 'Plano', tipo: 'select', opcoes: PLANOS, padrao: 'sala', meia: true },
      { k: 'acesso_ate', t: 'Acesso até', tipo: 'date', padrao: () => maisDias(hojeSP(), 30), meia: true },
      { k: 'tradersystem', t: 'Plus: acesso ao GesRisk Trader', tipo: 'check' },
      { k: 'observacao', t: 'Observação', dica: 'ex.: pagou por Pix em 23/11' },
    ],
  },
  agenda: {
    nome: 'Agenda', novo: '+ Nova sessão', ordem: (a, b) => b.inicio.localeCompare(a.inicio), busca: (x) => `${x.titulo} ${x.com}`,
    linha: (x) => `<div class="quem"><b>${esc(x.titulo)}</b><span>${quando(x.inicio)}${x.fim ? ' até ' + quando(x.fim).slice(-5) : ''} · com ${esc(x.com)} · ${{ sala: 'Sala ao vivo', mentoria: 'Mentoria', evento: 'Evento aberto' }[x.tipo]}</span></div>
      <span class="tag ${x.link ? 'compra' : ''}">${x.link ? 'Link próprio' : 'Link padrão'}</span><div class="acoes"><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'tipo', t: 'Tipo', tipo: 'select', opcoes: { sala: 'Sala ao vivo', mentoria: 'Encontro da mentoria', evento: 'Evento aberto (gratuito)' }, padrao: 'sala', meia: true },
      { k: 'com', t: 'Com', padrao: 'Marcelo', meia: true },
      { k: 'titulo', t: 'Título', padrao: 'Sala ao vivo', obrig: true },
      { k: 'inicio', t: 'Início (horário de Brasília)', tipo: 'datetime', obrig: true, meia: true },
      { k: 'fim', t: 'Fim', tipo: 'datetime', meia: true },
      { k: 'link', t: 'Link do Zoom', tipo: 'url', dica: 'Vazio = usa o link padrão da sala (aba Downloads e links).' },
      { k: 'planos', t: 'Quais planos veem', tipo: 'planos', padrao: ['sala', 'mentoria'] },
    ],
  },
  cursos: {
    nome: 'Cursos', novo: '+ Novo curso', ordem: (a, b) => a.ordem - b.ordem, busca: (x) => `${x.titulo} ${x.tema}`,
    linha: (x) => `<div class="quem"><b>${esc(x.titulo)}${x.ativo ? '' : ' (oculto)'}</b><span>${x.tipo === 'gravacoes' ? 'Biblioteca de gravações da sala' : esc(x.tema)} · ${x.gratuito ? 'Gratuito' : x.planos.map((p) => PLANOS[p]).join(', ')}</span></div>
      <div class="acoes"><a class="btn leve peq" href="#aulas/${x.id}">Aulas</a><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'titulo', t: 'Título', obrig: true },
      { k: 'tipo', t: 'Tipo', tipo: 'select', opcoes: { curso: 'Curso', gravacoes: 'Gravações da sala' }, padrao: 'curso', meia: true },
      { k: 'tema', t: 'Tema', padrao: 'Método', meia: true },
      { k: 'descricao', t: 'Descrição', tipo: 'textarea' },
      { k: 'capa_url', t: 'Imagem de capa (link)', tipo: 'url' },
      { k: 'planos', t: 'Quais planos acessam', tipo: 'planos', padrao: TODOS },
      { k: 'gratuito', t: 'Gratuito para qualquer cadastrado', tipo: 'check' },
      { k: 'ordem', t: 'Ordem', tipo: 'number', padrao: 0, meia: true },
      { k: 'ativo', t: 'Visível', tipo: 'check', padrao: true },
    ],
  },
  aulas: {
    nome: 'Aulas', novo: '+ Nova aula', ordem: (a, b) => a.curso_id - b.curso_id || b.numero - a.numero, busca: (x) => `${x.titulo} ${x.bloco}`,
    filtroCurso: true,
    linha: (x) => `<div class="quem"><b>Aula ${x.numero} · ${esc(x.titulo)}</b><span>${esc(cursos.find((c) => c.id === x.curso_id)?.titulo || '')}${x.bloco ? ' · ' + esc(x.bloco) : ''}${x.duracao ? ' · ' + esc(x.duracao) : ''}</span></div>
      <span class="tag ${x.video_url ? 'compra' : ''}">${x.video_url ? 'Com vídeo' : 'Sem vídeo'}</span><div class="acoes"><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'curso_id', t: 'Curso', tipo: 'curso', obrig: true },
      { k: 'numero', t: 'Número', tipo: 'number', padrao: 1, meia: true },
      { k: 'duracao', t: 'Duração', dica: 'ex.: 1h42', meia: true },
      { k: 'titulo', t: 'Título', obrig: true },
      { k: 'bloco', t: 'Bloco', dica: 'Agrupa as aulas: Fundamentos, Leitura de fluxo...' },
      { k: 'descricao', t: 'Descrição', tipo: 'textarea' },
      { k: 'video_url', t: 'Vídeo (YouTube não listado)', tipo: 'url' },
      { k: 'material_url', t: 'Material de apoio (link)', tipo: 'url' },
    ],
  },
  analises: {
    nome: 'Análises', novo: '+ Nova análise', ordem: (a, b) => b.criado_em.localeCompare(a.criado_em), busca: (x) => `${x.ativo} ${x.texto}`,
    linha: (x) => `<div class="quem"><b>${esc(x.ativo)} · <span class="tag ${x.direcao}">${x.direcao}</span> · ${esc(x.momento)}</b><span>${esc(x.texto.slice(0, 120))}</span></div>
      <span class="fraco">${quando(x.criado_em)}</span><div class="acoes"><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'ativo', t: 'Ativo', tipo: 'select', opcoes: { WIN: 'WIN', WDO: 'WDO', IND: 'IND', DOL: 'DOL', 'S&P': 'S&P', NASDAQ: 'Nasdaq' }, padrao: 'WIN', meia: true },
      { k: 'direcao', t: 'Direção', tipo: 'select', opcoes: { compra: 'Compra', venda: 'Venda', neutro: 'Neutro' }, padrao: 'compra', meia: true },
      { k: 'momento', t: 'Momento', tipo: 'select', opcoes: { 'Pré-abertura': 'Pré-abertura', 'Manhã': 'Manhã', 'Tarde': 'Tarde', 'Semanal': 'Semanal' }, padrao: 'Pré-abertura', meia: true },
      { k: 'autor', t: 'Autor', padrao: 'Marcelo Ceribelli', meia: true },
      { k: 'texto', t: 'Análise', tipo: 'textarea', obrig: true },
      { k: 'imagem_url', t: 'Print do gráfico (link)', tipo: 'url' },
    ],
    antesDeSalvar: (o) => { if (!o.id) o.criado_em = new Date().toISOString() },
  },
  avisos: {
    nome: 'Avisos', novo: '+ Novo aviso', ordem: (a, b) => (b.criado_em || '').localeCompare(a.criado_em || ''), busca: (x) => x.texto,
    linha: (x) => `<div class="quem"><b>${esc(x.texto)}</b><span>${x.ativo ? 'Aparece no Início' : 'Oculto'}</span></div><div class="acoes"><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [{ k: 'texto', t: 'Aviso', tipo: 'textarea', obrig: true }, { k: 'link', t: 'Link (opcional)', tipo: 'url' }, { k: 'ativo', t: 'Mostrar no Início', tipo: 'check', padrao: true }],
    antesDeSalvar: (o) => { if (!o.id) o.criado_em = new Date().toISOString() },
  },
  conteudo: {
    nome: 'Downloads e links', novo: '+ Novo item', ordem: (a, b) => a.tipo.localeCompare(b.tipo) || a.ordem - b.ordem, busca: (x) => x.titulo,
    linha: (x) => `<div class="quem"><b>${esc(x.titulo)}${x.ativo ? '' : ' (oculto)'}</b><span>${{ indicador: 'Indicador', instalacao: 'Instalação', sala: 'Link padrão da sala' }[x.tipo]} · ${x.url ? esc(x.url) : 'sem link: aparece "Em breve"'}</span></div>
      <span class="tag ${x.url ? 'compra' : ''}">${x.url ? 'Com link' : 'Em breve'}</span><div class="acoes"><button class="btn contorno peq" type="button" data-editar>Editar</button></div>`,
    campos: [
      { k: 'tipo', t: 'Tipo', tipo: 'select', opcoes: { indicador: 'Indicador', instalacao: 'Como instalar', sala: 'Link padrão da sala' }, padrao: 'indicador', meia: true },
      { k: 'ordem', t: 'Ordem', tipo: 'number', padrao: 0, meia: true },
      { k: 'titulo', t: 'Título', obrig: true }, { k: 'descricao', t: 'Descrição' },
      { k: 'url', t: 'Link (Google Drive, YouTube, Zoom)', tipo: 'url' }, { k: 'plataforma', t: 'Plataforma', dica: 'ex.: MT5 · Profit' },
      { k: 'planos', t: 'Quais planos veem', tipo: 'planos', padrao: TODOS }, { k: 'ativo', t: 'Visível', tipo: 'check', padrao: true },
    ],
  },
}

let aba = 'assinaturas', dados = [], filtroCurso = ''
$('abas').innerHTML = Object.entries(ABAS).map(([k, a]) => `<button class="chip" type="button" data-aba="${k}">${a.nome}</button>`).join('')
$('abas').onclick = (e) => { const b = e.target.closest('[data-aba]'); if (b) { location.hash = b.dataset.aba } }
window.addEventListener('hashchange', lerHash)

async function lerHash() {
  const [a, curso] = location.hash.replace('#', '').split('/')
  aba = ABAS[a] ? a : 'assinaturas'
  filtroCurso = aba === 'aulas' ? curso || '' : ''
  document.querySelectorAll('#abas [data-aba]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.aba === aba))
  await carregar()
}

async function carregar() {
  cursos = await repo.listar('cursos')
  dados = (await repo.listar(aba)).sort(ABAS[aba].ordem)
  desenhar()
}

function desenhar() {
  const cfg = ABAS[aba]
  let topo = ''
  if (aba === 'assinaturas') {
    const em7 = maisDias(hojeSP(), 7)
    topo = `<div class="numeros">
      <div class="card numero"><b style="color:var(--green)">${dados.filter(emDia).length}</b><span>Em dia</span></div>
      <div class="card numero"><b style="color:var(--yellow)">${dados.filter((x) => emDia(x) && x.acesso_ate <= em7).length}</b><span>Vencem em 7 dias</span></div>
      <div class="card numero"><b style="color:var(--red)">${dados.filter((x) => !emDia(x)).length}</b><span>Vencidos</span></div>
      <div class="card numero"><b style="color:var(--gold2)">${dados.filter((x) => emDia(x) && x.tradersystem).length}</b><span>Com Plus</span></div></div>`
  }
  const filtroAulas = cfg.filtroCurso ? `<select class="campo" id="filtroCurso" style="max-width:280px"><option value="">Todos os cursos</option>${cursos.map((c) => `<option value="${c.id}" ${String(c.id) === filtroCurso ? 'selected' : ''}>${esc(c.titulo)}</option>`).join('')}</select>` : ''
  $('corpo').innerHTML = `${topo}<div class="ferr"><input class="campo" id="busca" type="search" placeholder="Buscar...">${filtroAulas}<button class="btn ouro" type="button" id="novo">${cfg.novo}</button></div><div class="linhas" id="linhas"></div>`
  $('busca').oninput = desenharLinhas
  if ($('filtroCurso')) $('filtroCurso').onchange = (e) => { location.hash = `aulas/${e.target.value}` }
  $('novo').onclick = () => abrir(null)
  desenharLinhas()
}
function desenharLinhas() {
  const cfg = ABAS[aba], q = $('busca').value.trim().toLowerCase()
  const lista = dados.filter((x) => (!filtroCurso || String(x.curso_id) === filtroCurso) && (!q || cfg.busca(x).toLowerCase().includes(q)))
  $('linhas').innerHTML = lista.map((x, i) => `<div class="card linha" data-i="${dados.indexOf(x)}">${cfg.linha(x)}</div>`).join('') || '<div class="card vazio">Nada por aqui ainda.</div>'
}
$('corpo').onclick = async (e) => {
  const r = e.target.closest('[data-renovar]')
  if (r) { r.disabled = true; await repo.renovar(r.dataset.renovar, 30); return carregar() }
  const ed = e.target.closest('[data-editar]')
  if (ed) abrir(dados[Number(ed.closest('[data-i]').dataset.i)])
}

// ── formulário genérico ─────────────────────────────────────────────────────
let editando = null
function campoHTML(c, v) {
  const id = 'f_' + c.k
  const rot = `<label for="${id}">${c.t}</label>`
  const dica = c.dica ? `<p class="dica">${c.dica}</p>` : ''
  let input
  if (c.tipo === 'select') input = `<select class="campo" id="${id}">${Object.entries(c.opcoes).map(([o, n]) => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`
  else if (c.tipo === 'curso') input = `<select class="campo" id="${id}">${cursos.map((cu) => `<option value="${cu.id}" ${cu.id === v ? 'selected' : ''}>${esc(cu.titulo)}</option>`).join('')}</select>`
  else if (c.tipo === 'textarea') input = `<textarea class="campo" id="${id}">${esc(v)}</textarea>`
  else if (c.tipo === 'check') return `<div class="grupo"><label class="marca-unica"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${c.t}</label>${dica}</div>`
  else if (c.tipo === 'planos') input = `<div class="marcas" id="${id}">${Object.entries(PLANOS).map(([p, n]) => `<label><input type="checkbox" value="${p}" ${(v || []).includes(p) ? 'checked' : ''}> ${n}</label>`).join('')}</div>`
  else {
    const tipo = { email: 'email', date: 'date', datetime: 'datetime-local', number: 'number', url: 'url' }[c.tipo] || 'text'
    const valor = c.tipo === 'datetime' ? paraLocal(v) : v
    input = `<input class="campo" id="${id}" type="${tipo}" value="${esc(valor)}" ${editando && c.fixoAoEditar ? 'disabled' : ''} ${c.tipo === 'url' ? 'placeholder="https://..."' : ''}>`
  }
  return `<div class="grupo" ${c.meia ? 'data-meia' : ''}>${rot}${input}${dica}</div>`
}
function abrir(x) {
  editando = x
  const cfg = ABAS[aba]
  $('dlgTitulo').textContent = (x ? 'Editar · ' : 'Novo · ') + cfg.nome.toLowerCase()
  const html = cfg.campos.map((c) => {
    const padrao = typeof c.padrao === 'function' ? c.padrao() : c.padrao
    let v = x ? x[c.k] : padrao
    if (!x && c.k === 'curso_id' && filtroCurso) v = Number(filtroCurso)
    if (!x && c.k === 'curso_id' && !v) v = cursos[0]?.id
    return campoHTML(c, v ?? (c.tipo === 'check' ? false : ''))
  })
  // campos "meia" lado a lado, dois a dois
  let saida = '', pend = []
  html.forEach((h) => { if (h.includes('data-meia')) { pend.push(h); if (pend.length === 2) { saida += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${pend.join('')}</div>`; pend = [] } } else { saida += pend.join('') + h; pend = [] } })
  $('campos').innerHTML = saida + pend.join('')
  $('dlgRemover').hidden = !x
  $('dlgMsg').textContent = ''
  $('dlg').showModal()
}
$('dlgCancelar').onclick = () => $('dlg').close()
$('dlgRemover').onclick = async () => {
  if (!confirm('Remover este item? Não dá para desfazer.')) return
  await repo.remover(aba, editando[CHAVES[aba]]); $('dlg').close(); carregar()
}
$('form').onsubmit = async (e) => {
  e.preventDefault()
  const cfg = ABAS[aba]
  const o = editando ? { ...editando } : {}
  for (const c of cfg.campos) {
    const el = $('f_' + c.k)
    if (c.tipo === 'check') o[c.k] = el.checked
    else if (c.tipo === 'planos') o[c.k] = [...el.querySelectorAll('input:checked')].map((i) => i.value)
    else if (c.tipo === 'number' || c.tipo === 'curso') o[c.k] = Number(el.value) || 0
    else if (c.tipo === 'datetime') o[c.k] = deLocal(el.value)
    else if (c.tipo === 'date') o[c.k] = el.value || null
    else o[c.k] = el.value.trim()
    if (c.obrig && (o[c.k] === '' || o[c.k] == null)) { $('dlgMsg').textContent = `Preencha: ${c.t}.`; return }
    if (c.tipo === 'url' && o[c.k] && !/^https?:\/\//i.test(o[c.k])) { $('dlgMsg').textContent = `${c.t}: o link precisa começar com https://`; return }
    if (c.tipo === 'planos' && !o[c.k].length) { $('dlgMsg').textContent = 'Marque pelo menos um plano.'; return }
  }
  if (aba === 'assinaturas' && !editando && dados.some((x) => x.email === o.email.toLowerCase())) { $('dlgMsg').textContent = 'Esse e-mail já está cadastrado. Use Editar.'; return }
  cfg.antesDeSalvar?.(o)
  try { await repo.salvar(aba, o); $('dlg').close(); carregar() }
  catch (err) { $('dlgMsg').textContent = err.message }
}

lerHash()
</script>
